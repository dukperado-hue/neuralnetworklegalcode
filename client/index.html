    <link rel="icon" type="image/png" href="/manus-storage/legal-atlas-mark_676ff7e4.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ประมวลกฎหมายฉบับ Neural Network | ประมวลNN</title>
    <!--
      Pairs with public/404.html - decodes the redirect it produced back
      into a real path via history.replaceState, BEFORE wouter (loaded by
      the deferred module script below) ever reads window.location. Must be
      a plain synchronous script, not type="module", so it runs during HTML
      parsing rather than being deferred like the app bundle is.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
